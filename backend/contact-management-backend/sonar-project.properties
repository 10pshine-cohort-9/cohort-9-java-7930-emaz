sonar.projectKey=contact-management-backend
sonar.projectName=Contact Management Backend
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000

# ======== BACKEND (Java) ========
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=target/jacoco.exec

# ======== FRONTEND (JavaScript/React) ========
sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.lcov.reportPaths=../frontend/coverage/lcov.info
sonar.javascript.exclusions=**/node_modules/**,**/build/**,**/dist/**

# ======== EXCLUSIONS ========
sonar.exclusions=**/entity/**/*,**/dto/**/*,**/config/**/*,**/exception/**/*,**/security/**/*
sonar.test.exclusions=**/repository/**/*,**/node_modules/**/*

# ======== JAVA VERSION ========
sonar.java.source=17
sonar.java.target=17

# ======== QUALITY GATE ========
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300